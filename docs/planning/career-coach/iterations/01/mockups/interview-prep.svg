<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="900" height="600" fill="#ffffff" stroke="#cccccc"/>
  <rect x="0" y="0" width="900" height="50" fill="#1f2937"/>
  <text x="20" y="31" fill="#ffffff" font-size="18" font-weight="bold">Career Coach</text>

  <rect x="0" y="50" width="180" height="550" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="20" y="113" font-size="14" fill="#374151">Strategy Plan</text>
  <text x="20" y="153" font-size="14" fill="#374151">Positions</text>
  <text x="20" y="193" font-size="14" fill="#374151">Applications</text>
  <rect x="0" y="210" width="180" height="36" fill="#dbeafe"/>
  <text x="20" y="233" font-size="14" fill="#1e3a8a">Interview Prep</text>
  <text x="20" y="273" font-size="14" fill="#374151">Negotiation</text>

  <text x="210" y="90" font-size="20" font-weight="bold" fill="#111827">Interview Prep — APP-3301</text>
  <text x="210" y="112" font-size="12" fill="#6b7280">Acme Cloud — Senior Backend Engineer</text>

  <rect x="210" y="130" width="140" height="24" rx="12" fill="#fef9c3"/>
  <text x="222" y="146" font-size="12" fill="#854d0e">Stage: PhoneScreen</text>

  <rect x="210" y="170" width="640" height="1" fill="#e5e7eb"/>

  <text x="210" y="200" font-size="14" font-weight="bold" fill="#111827">Focus for this stage</text>
  <text x="210" y="222" font-size="13" fill="#374151">Screening-level: background, logistics, and high-level fit</text>

  <rect x="210" y="240" width="640" height="130" rx="4" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="226" y="263" font-size="13" fill="#111827">• Walk through your background at a high level (2 minutes)</text>
  <text x="226" y="288" font-size="13" fill="#111827">• Confirm remote-work logistics and availability to start</text>
  <text x="226" y="313" font-size="13" fill="#111827">• Explain interest in Acme Cloud's platform team specifically</text>
  <text x="226" y="338" font-size="13" fill="#111827">• Have 2 clarifying questions ready about team structure</text>

  <text x="210" y="400" font-size="12" fill="#9ca3af">Later stages of this same application will receive different,</text>
  <text x="210" y="418" font-size="12" fill="#9ca3af">deeper prep once APP-3301 advances (e.g. FinalInterview).</text>
